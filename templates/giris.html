<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='stil.css') }}" rel="stylesheet">
</head>
<body>
<main class="giris-sayfa">
  <div class="kart giris-kart">
    <h1>Hoş geldiniz</h1>
    <p class="alt">İşletmenize giriş yapın</p>
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
    <form method="POST" action="/giris">
        <div class="mb-3"><label class="form-label">İşletme adı</label>
            <input type="text" name="isletme_adi" class="form-control" required autofocus></div>
        <div class="mb-4"><label class="form-label">Şifre</label>
            <input type="password" name="sifre" class="form-control" required></div>
        <button type="submit" class="btn btn-brand w-100 py-2">Giriş yap</button>
    </form>
    <p class="text-center mt-4 mb-0 small">Hesabınız yok mu? <a href="/" class="fw-bold" style="color:var(--brand)">Kayıt olun</a></p>
  </div>
</main>
</body>
</html>
