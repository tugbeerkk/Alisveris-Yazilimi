<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürün ekle</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='stil.css') }}" rel="stylesheet">
</head>
<body>
<header class="topbar">
    <p class="brand">Ürün ekle<small>{{ isletme.isletme_adi }}</small></p>
    <div class="nav-actions">
        <a href="/urun" class="btn btn-ghost btn-sm">Ürünler</a>
        <a href="/kasa" class="btn btn-ghost btn-sm">Kasa</a>
        <a href="/hatirlatici" class="btn btn-ghost btn-sm">Hatırlatıcı</a>
        <a href="/raporlar" class="btn btn-ghost btn-sm">Raporlar</a>
        <a href="/panel" class="btn btn-ghost btn-sm">Panele dön</a>
    </div>
</header>


<main class="container py-4" style="max-width:560px">
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
    <div class="kart">
        <div class="kart-baslik">Yeni ürün</div>
        <div class="kart-govde">
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3"><label class="form-label">Ürün adı</label>
                <input type="text" name="urun_adi" class="form-control" required autofocus></div>
            <div class="row">
                <div class="col-6 mb-3"><label class="form-label">Satış fiyatı (₺)</label>
                    <input type="number" step="1" name="fiyat" class="form-control" value="0" min="0" required></div>
                <div class="col-6 mb-3"><label class="form-label">Alış fiyatı (₺)</label>
                    <input type="number" step="0.01" name="maliyet" class="form-control" value="0" required></div>
            </div>
            <div class="mb-3"><label class="form-label">Stok miktarı</label>
                <input type="number" name="stok_miktari" class="form-control" value="0" min="0" required></div>
            <div class="mb-4"><label class="form-label">Ürün görseli</label>
                <input type="file" name="resim" class="form-control" accept="image/*"></div>
            <button type="submit" class="btn btn-brand w-100 py-2">Ürünü kaydet</button>
        </form>
        </div>
    </div>
</main>
</body>
</html>
